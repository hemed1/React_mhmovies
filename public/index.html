    <style>
        /* Full-screen overlay configuration */
        #video-loader-container {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background: #000;
          display: flex;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          transition: opacity 15.0s ease-out; /* Smooth fade-out */
        }
        #video-loader-container video {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        /* Hidden utility class */
        .loader-hidden {
          opacity: 0;
          pointer-events: none;
        }
